<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>냉장고 파먹기 🍳</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>냉장고 파먹기 🍳</h1>
      <p class="subtitle">가지고 있는 재료로 오늘 뭐 먹지?</p>
    </header>
    
    <main>
      <!-- 검색 영역 -->
      <section class="search-section glass-panel">
        <input type="text" id="searchInput" placeholder="재료를 검색하세요 (예: 당근, 양파, 돼지고기, 계란)">
        <div id="searchResults" class="search-results">
          <!-- 검색된 재료 아이템이 동적으로 들어옴 -->
        </div>
      </section>

      <!-- 보관소 영역 (상온 보관함 + 냉장고) -->
      <div class="storage-area">
        <section class="pantry-container glass-panel">
          <h2>상온 보관함 🧺</h2>
          <div id="pantryZone" class="dropzone pantry-zone">
            <span class="empty-hint">여기에 실온 재료를 드롭하세요</span>
          </div>
        </section>

        <section class="fridge-container glass-panel">
          <h2>우리집 냉장고 ❄️</h2>
          <div class="fridge" id="fridge">
            <div class="fridge-interior dropzone" id="fridgeZone">
              <div class="fridge-shelf"></div>
              <div class="fridge-shelf"></div>
              <div class="fridge-shelf"></div>
              <div class="fridge-drawer"></div>
            </div>
            <!-- 돌아가는 냉장고 문 (클릭으로 열고 닫음) -->
            <div class="fridge-door" id="fridgeDoor">
              <div class="fridge-handle"></div>
              <div class="door-decor">
                <span>자석 📝</span>
                <span>사진 🖼️</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 추천 레시피 영역 -->
      <section class="recipe-section glass-panel">
        <h2>🔥 오늘의 추천 레시피</h2>
        <div id="recipeList" class="recipe-list">
          <p class="empty-msg">오른쪽 보관함에 재료를 넣으시면 레시피를 추천해드려요!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
